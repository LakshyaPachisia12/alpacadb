name: AlpacaDB CI (Strict Mode)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:

  # =========================================================
  # JOB 1: TEST EXECUTION (STRICT)
  # =========================================================
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
              uv pip install --system -r requirements.txt
          else
              uv pip install --system pytest pytest-cov pylint bandit
          fi

      - name: Run pytest (strict)
        run: |
          if [ -d tests ]; then
              pytest tests/ -v --tb=short
          else
              echo "Tests directory missing."
              exit 1
          fi


  # =========================================================
  # JOB 2: COVERAGE ANALYSIS (STRICT)
  # =========================================================
  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
              uv pip install --system -r requirements.txt
          else
              uv pip install --system pytest pytest-cov pylint bandit
          fi

      - name: Run coverage
        run: |
          if [ -d tests ] && [ -d src ]; then
              pytest tests/ --cov=src --cov-report=html --cov-report=json:coverage.json
          else
              echo "Source or tests directory missing."
              exit 1
          fi

      - name: Enforce minimum coverage threshold (75%)
        run: |
          coverage_percent=$(python3 - << 'EOF'
import json
d=json.load(open("coverage.json"))
print(d['totals']['percent_covered'])
EOF
)
          echo "Coverage: $coverage_percent%"
          if (( $(echo "$coverage_percent < 75" | bc -l) )); then
              echo "Coverage below 75% threshold."
              exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/


  # =========================================================
  # JOB 3: STATIC ANALYSIS WITH PYLINT (STRICT)
  # =========================================================
  lint:
    name: Static Code Analysis (Pylint)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
              uv pip install --system -r requirements.txt
          else
              uv pip install --system pytest pytest-cov pylint bandit
          fi

      - name: Run pylint (strict)
        run: |
          if [ -d src ]; then
              pylint src/ --output-format=text --reports=yes | tee lint-report.txt
          else
              echo "Source directory missing."
              exit 1
          fi

      - name: Enforce pylint minimum score (7.5)
        run: |
          score=$(grep "rated at" lint-report.txt | grep -oP "\d+\.\d+")
          echo "Pylint score: $score"
          if (( $(echo "$score < 7.5" | bc -l) )); then
              echo "Pylint score below required 7.5."
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt


  # =========================================================
  # JOB 4: SECURITY SCAN WITH BANDIT (STRICT)
  # =========================================================
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
              uv pip install --system -r requirements.txt
          else
              uv pip install --system pytest pytest-cov pylint bandit
          fi

      - name: Run Bandit scan
        run: |
          if [ -d src ]; then
              bandit -r src/ -f json -o security-report.json
          else
              echo "Source directory missing."
              exit 1
          fi

      - name: Fail if HIGH severity issues exist
        run: |
          critical=$(python3 - << 'EOF'
          import json
          d=json.load(open("security-report.json"))
          count = len([x for x in d.get("results", []) if x["issue_severity"]=="HIGH"])
          print(count)
          EOF
          )
          echo "High severity vulnerabilities: $critical"
          if [ "$critical" -gt 0 ]; then
              echo "High severity vulnerabilities detected."
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json


  # =========================================================
  # JOB 5: DEPLOYMENT ARTIFACT
  # =========================================================
  deploy:
    name: Build Deployment Artifact
    runs-on: ubuntu-latest
    needs: [test, coverage, lint, security]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment folder
        run: |
          mkdir -p deployment/src deployment/tests deployment/reports
          cp -r src deployment/src/
          cp -r tests deployment/tests/ || true
          cp README.md deployment/ || true
          cp requirements.txt deployment/ || true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: deployment/reports/

      - name: Create deployment zip
        run: |
          cd deployment
          zip -r ../deployment-package.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-package.zip
