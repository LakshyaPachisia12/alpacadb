[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpacadb"
version = "0.2.0"
description = "AlpacaDB - A custom relational database management system built from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.4.2",
    "pytest-cov>=4.1.0",
    "pylint>=3.0.3",
    "bandit>=1.7.5",
]

[project.scripts]
alpaca = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.storage", "src.storage.indexing", "src.query", "src.executor", "src.optimizer"]
